        X.fillStyle = '#fff2b0'; X.beginPath(); X.arc(p.dr * 4, 0, 15, 0, 7); X.fill();
        X.shadowBlur = 0; X.font = '28px serif'; X.fillText('🐾', 0, 10)
      } else if (k == 'i') {
        const h = ag < 5 ? ag * 22 : ag < 22 ? 110 : Math.max(0, 110 - (ag - 22) * 9);
        const sk = (cx, hh, w) => { X.fillStyle = '#bfeaff'; X.strokeStyle = '#fff'; X.lineWidth = 2; X.beginPath(); X.moveTo(cx - w, 0); X.lineTo(cx, -hh); X.lineTo(cx + w, 0); X.closePath(); X.fill(); X.stroke(); X.fillStyle = 'rgba(255,255,255,.7)'; X.beginPath(); X.moveTo(cx - w, 0); X.lineTo(cx, -hh); X.lineTo(cx - w * .2, 0); X.fill() };
        sk(0, h, 20); sk(-20, h * .55, 12); sk(20, h * .6, 12)
      } else if (k == 'y') yy(0, 0, 22, ag * .35)
      else if (k == 'q') {
        X.shadowBlur = 0; X.fillStyle = '#6b4a30'; X.strokeStyle = '#caa070'; X.lineWidth = 2;
        for (let i = 0; i < 4; i++) { const ox = -Math.sign(p.vx) * i * 15, hh = 44 - i * 9 + (ag * 7 + i * 3) % 6; X.beginPath(); X.moveTo(ox - 9, 0); X.lineTo(ox - 1, -hh); X.lineTo(ox + 9, 0); X.closePath(); X.fill(); X.stroke() }
      } else if (k == 'r') {
        X.shadowBlur = 0; X.globalAlpha = .3; X.fillStyle = s; X.beginPath(); X.ellipse(0, p.y, 26, 6, 0, 0, 7); X.fill();   // 落点预警
        X.globalAlpha = .5; X.strokeStyle = s; X.lineWidth = 7; X.beginPath(); X.moveTo(0, -60); X.lineTo(0, 0); X.stroke(); X.globalAlpha = 1;
        X.shadowBlur = 12; X.font = '34px serif'; X.fillText('🐾', 0, 12)
      }
      X.restore()
    }
    function draw() {
      X.clearRect(0, 0, W, H); if (!F.length) { X.drawImage(bg, 0, 0); return }
      const cast = ph == 'fight' && F.find(f => f.st == 'atk' && f.a == 's');
      X.save(); if (shk > 0) X.translate((Math.random() - .5) * shk, (Math.random() - .5) * shk);
      X.drawImage(bg, 0, 0); X.textAlign = 'center';
      if (cast && cast.t < 34) { X.fillStyle = 'rgba(0,0,0,' + .45 * Math.min(1, cast.t / 5, (34 - cast.t) / 10) + ')'; X.fillRect(-10, -10, W + 20, H + 20) }
      for (const f of F) {
        X.fillStyle = 'rgba(0,0,0,.3)'; X.beginPath(); X.ellipse(f.x, GY + 4, 28 - f.y / 8, 7, 0, 0, 7); X.fill();
        const sa = f.st == 'atk' && f.a == 's', y = GY - f.y;
        if (sa && f.t < f.A.rf) aura(f);
        if (f.gh) {
          f.gh.forEach((gx, i) => { X.globalAlpha = .08 + i * .05; bear(X, f, gx, y) }); X.globalAlpha = 1;
          X.strokeStyle = '#ffe04a'; X.lineWidth = 3; X.beginPath(); X.moveTo(f.gh[0], y - 50); f.gh.forEach(gx => X.lineTo(gx, y - 50 + (Math.random() - .5) * 30)); X.stroke()
        }
        bear(X, f, f.x, y); zfx(f);
        if (f.gb > 0) { X.font = 'bold 22px sans-serif'; X.lineWidth = 4; X.strokeStyle = '#7a2e0e'; X.fillStyle = '#fff'; X.strokeText('破防！', f.x, y - 135); X.fillText('破防！', f.x, y - 135) }
      }
      for (const p of P) drawP(p);
      for (const q of pa) { X.globalAlpha = Math.max(0, q.l / q.m); X.fillStyle = q.c; X.beginPath(); X.arc(q.x, GY - q.y, q.r, 0, 7); X.fill() } X.globalAlpha = 1;
      for (const e of fx) { X.strokeStyle = e.b ? '#8cf' : '#fff'; X.lineWidth = 3; X.beginPath(); X.arc(e.x, GY - e.y, 6 + e.t * 3, 0, 7); X.stroke() }
      X.restore();
      // 终结技命中白闪
      if (fl > 0) { X.fillStyle = 'rgba(255,255,255,' + fl * .06 + ')'; X.fillRect(0, 0, W, H) }
      F.forEach((f, i) => {
        const hp = Math.max(0, f.hp) / C[f.c].hp, x0 = i ? W - 360 : 30, rdy = f.en >= 50;
        X.fillStyle = '#000a'; X.fillRect(x0 - 3, 17, 336, 22); X.fillStyle = hp > .3 ? '#ffb84d' : '#f44'; X.fillRect(i ? x0 + 330 * (1 - hp) : x0, 20, 330 * hp, 16);
        X.fillStyle = rdy ? (fr % 24 < 12 ? '#ffd54f' : '#ff9800') : '#4af'; X.fillRect(i ? x0 + 330 * (1 - f.en / 100) : x0, 42, 330 * f.en / 100, 6);
        X.fillStyle = '#fffa'; X.fillRect(x0 + 164, 41, 2, 8); X.fillStyle = '#000a'; X.fillRect(x0 - 1, 50, 332, 11); X.fillStyle = f.gd < 25 ? '#ff6a5a' : '#7fe0a0'; X.fillRect(i ? x0 + 330 * (1 - f.gd / 100) : x0, 51, 330 * Math.max(0, f.gd) / 100, 9);
        // 防御槽被消耗时整条闪白（本地根据数值变化触发，联机双方都能看到）
        if (f.gd < f.gl - .5) f.gf = 14; f.gl = f.gd; if (f.gf > 0) { f.gf--; X.fillStyle = 'rgba(255,255,255,' + f.gf / 20 + ')'; X.fillRect(x0 - 1, 50, 332, 11) }
        X.fillStyle = '#fff'; X.font = 'bold 15px sans-serif'; X.textAlign = i ? 'right' : 'left'; X.fillText(C[f.c].n, i ? x0 + 330 : x0, 78);
        if (rdy) { X.fillStyle = '#ffd54f'; X.font = 'bold 13px sans-serif'; X.textAlign = i ? 'left' : 'right'; X.fillText('★' + SP[f.c].n, i ? x0 : x0 + 330, 78) }
        for (let j = 0; j < 2; j++) { X.fillStyle = j < wins[i] ? '#f33' : '#5a4a42'; X.beginPath(); X.arc(i ? x0 + 322 - j * 20 : x0 + 8 + j * 20, 92, 6, 0, 7); X.fill() }
      });
      // 连击计数：显示在进攻方一侧（被打的是 f，进攻方在另一边），出现时放大弹出
      F.forEach((f, i) => {
        if (!(f.cd > 0 && f.cc >= 2)) return;
        const pop = Math.max(0, f.cd - 48) / 7, cx = i ? 105 : W - 105, txt = f.cc + ' 连击';
        X.save(); X.globalAlpha = Math.min(1, f.cd / 12); X.textAlign = 'center';
        X.font = 'italic bold ' + (40 + pop * 16 + Math.min(f.cc, 5) * 3 | 0) + 'px sans-serif'; X.lineWidth = 6; X.strokeStyle = '#7a2e0e';
        X.strokeText(txt, cx, 150); X.fillStyle = f.cc >= 3 ? '#ffd54f' : '#ffb84d'; X.fillText(txt, cx, 150);
        X.restore()
      });
      X.textAlign = 'center'; X.fillStyle = '#fff'; X.font = 'bold 32px sans-serif'; X.fillText(Math.max(0, Math.ceil(tm / 60)), W / 2, 40);
      const t = ph == 'intro' ? (pt > 45 ? 'ROUND ' + rd : 'FIGHT!') : ph == 'ko' ? msg : '';
      if (t) { X.font = 'bold 64px sans-serif'; X.lineWidth = 8; X.strokeStyle = '#7a2e0e'; X.strokeText(t, W / 2, 200); X.fillStyle = '#ffb84d'; X.fillText(t, W / 2, 200) }
      // 绝招名称横幅（由角色状态驱动，联机双方都能看到）
      if (cast && cast.t < 34) {
        const t = cast.t, s = SP[cast.c].c, dx = (1 - Math.min(1, t / 8)) * 220 * (cast.i ? 1 : -1);
        X.globalAlpha = Math.min(1, t / 5, (34 - t) / 8); X.fillStyle = 'rgba(0,0,0,.6)'; X.fillRect(0, 118, W, 62); X.fillStyle = s; X.fillRect(0, 118, W, 3); X.fillRect(0, 177, W, 3);
        X.font = 'italic bold 44px sans-serif'; X.lineWidth = 7; X.strokeStyle = '#000'; X.strokeText(SP[cast.c].n + '！', W / 2 + dx, 163); X.fillText(SP[cast.c].n + '！', W / 2 + dx, 163); X.globalAlpha = 1
      }
      padC.classList.toggle('rd', F[mode == 'on' ? me : 0].en >= 50 && ph == 'fight')
    }
    let last = 0, acc = 0;
    (function loop(ts) {
      requestAnimationFrame(loop); acc += Math.min(50, ts - last); last = ts;
      while (acc >= 16.67) { acc -= 16.67; if (F.length && ph != 'over' && ui.style.display == 'none') step() } draw()
    })(0);

    /* ---------- 横屏适配 ---------- */
    // 以容器（横屏）高度为基准：画布按 16:9 最大化铺满，--u 供 CSS 缩放菜单/按键，窄屏时角色选择改为 3 列
    function fit() {
      const a = $('app'), aw = a.clientWidth, ah = a.clientHeight; if (!aw || !ah) return;
      const w = Math.min(aw, ah * 16 / 9);
      cv.style.width = w + 'px'; cv.style.height = w * 9 / 16 + 'px';
      document.documentElement.style.setProperty('--u', ah / 100 + 'px');
      a.classList.toggle('nw', aw < 560)
    }
    // 触屏设备：用户点击后进入全屏并锁定横屏（需要用户手势；失败则忽略，竖屏时由 CSS 旋转兜底）
    function lockLand() {
      try {
        if (!matchMedia('(pointer:coarse)').matches) return;
        const d = document.documentElement, rq = d.requestFullscreen || d.webkitRequestFullscreen, lk = () => { try { screen.orientation.lock('landscape').catch(() => { }) } catch (e) { } };
        if (rq && !document.fullscreenElement && !document.webkitFullscreenElement) { const r = rq.call(d); r && r.then ? r.then(lk).catch(() => { }) : lk() } else lk()
      } catch (e) { }
    }
    addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250)); fit();

    /* ---------- 界面流程 ---------- */
    const show = h => { ui.innerHTML = h; ui.style.display = 'flex' };
    function dis() { try { peer && peer.destroy() } catch (e) { } conn = peer = null; setShare('') }
    function home() {
      dis(); F = []; R = ''; $('pad').style.display = 'none';
      show(`<div class=hm><div class=hl><h1>老熊格斗1.0</h1><p>🐻 各路熊熊高手，擂台见真章 🐻</p><small>手机：屏幕按键　电脑：WASD+JKL / 方向键+123<br>↑ 跳　↓ 防御　← → 左右移动　「绝」需蓝条过半<br>连击：拳/腿命中后再按一次，最多4段（拳腿任意搭配），第4段为重击终结<br>打满4段或吃到重击后对手有短暂保护，无法无限连击<br>防御（↓）会消耗防御槽（血条下方细条），见底即破防眩晕；超时按血量百分比判定</small></div><div class=hr><button onclick="go('ai')">人机对战</button><button onclick="go('2p')">本机双人</button><button onclick="go('on')">创建房间 · 邀请微信好友</button><button onclick="joinUI()">输入房间号加入</button></div></div>`)
    }
    function go(m) {
      lockLand(); mode = m; stage = 0;
      if (m == 'on' && (typeof Peer == 'undefined' || typeof RTCPeerConnection == 'undefined')) return show('<h2>当前环境无法联机</h2><p>请检查网络，或用系统浏览器（Safari / Chrome）打开本页</p><button class=s onclick=home()>返回</button>');
      sel(m == '2p' ? 'P1 选择角色' : R ? '选择你的熊' : '选择你的熊（你是房主）')
    }
    function sel(t) {
      show(`<h2>${t}</h2><div class=g>${C.map((c, i) => `<div class=cd onclick=pick(${i})><canvas id=m${i} width=100 height=120></canvas><b>${c.n}</b><small>${c.d}</small><em>绝：${SP[i].n}</em><small>${SD[i]}</small></div>`).join('')}</div><button class=s onclick=home()>返回</button>`);
      C.forEach((c, i) => bear($('m' + i).getContext('2d'), { c: i, f: 1, st: 'idle', t: 0 }, 50, 114))
    }
    function pick(i) {
      if (mode == 'ai') {
        c0 = i;
        // 随机选一个不同的角色作为AI对手，自动适配角色总数
        let offset = 1 + Math.floor(Math.random() * (C.length - 1));
        c1 = (i + offset) % C.length;
        start()
      }
      else if (mode == '2p') { if (!stage) { c0 = i; stage = 1; sel('P2 选择角色') } else { c1 = i; start() } }
      else { c0 = i; R ? join() : host() }
    }
    function start() { $('pad').style.display = mode == '2p' ? 'none' : 'flex'; wins = [0, 0]; rd = 1; reset(); ui.style.display = 'none' }
    const er = e => show(`<h2>连接失败</h2><p>${e.type == 'peer-unavailable' ? '房间不存在或已关闭，请核对房间号' : e.type || e}</p><button onclick=home()>返回</button>`);
    const lost = () => { if (ph != 'over') { F = []; show('<h2>对方已断开</h2><button onclick=home()>返回主菜单</button>') } };
    function host() {
      me = 0; const al = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', code = [0, 0, 0, 0].map(() => al[Math.random() * al.length | 0]).join('');
      let shown = 0; peer = new Peer('laoxiong-' + code, PC);
      peer.on('open', () => {
        if (shown) return; shown = 1;   // 重连时 open 会再次触发，避免覆盖对战画面
        LK = BASE + '?room=' + code; RC = code; setShare(code);
        show(`<h2>房间已创建，等待好友加入…</h2><div class=hm><div class=hl style="text-align:center"><b style="font-size:clamp(30px,calc(var(--u)*11),44px);letter-spacing:8px;color:#ffb84d">${code}</b><small id=tip>点「邀请微信好友」→ 选微信 → 选好友发送；也可让好友在「输入房间号加入」填房间号</small><input id=lk value="${LK}" readonly></div><div class=hr><button onclick=share()>邀请微信好友</button><button class=s onclick=cp(this)>复制邀请链接</button><button class=s onclick=home()>取消</button></div></div>`)
      });
      peer.on('connection', c => { conn = c; c.on('data', onMsg); c.on('close', lost) }); peer.on('error', er);
      // 房主切去微信发邀请时页面可能被挂起，回来后自动重连信令服务器，房间不会丢
      peer.on('disconnected', () => { try { peer && !peer.destroyed && peer.reconnect() } catch (e) { } })
    }
    function join() {
      me = 1; show('<h2>正在连接房间 ' + R + ' …</h2>'); peer = new Peer(undefined, PC);
      peer.on('open', () => { conn = peer.connect('laoxiong-' + R); conn.on('open', () => send({ t: 'hi', c: c0 })); conn.on('data', onMsg); conn.on('close', lost) }); peer.on('error', er)
    }
    const BASE = location.href.split(/[?#]/)[0], TTL = document.title, MOBILE = /Android|iPhone|iPad|iPod|HarmonyOS/i.test(navigator.userAgent);
    // 让当前页面地址 / 标题带上房间号：在微信里点 ··· 转发时，发出去的就是完整的房间链接
    function setShare(code) {
      try { if (!code && !location.search) return; history.replaceState(null, '', code ? BASE + '?room=' + code : BASE); document.title = code ? '老熊格斗｜房间号 ' + code + '，来一场熊熊对决！' : TTL } catch (e) { }
    }
    const inviteTxt = () => `老熊格斗｜房间号 ${RC}，来一场熊熊对决！点开链接直接加入：\n${LK}`;
    async function copyText(t) {
      try { await navigator.clipboard.writeText(t); return true } catch (e) { }
      try { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;left:-999px;top:0;opacity:0;-webkit-user-select:text;user-select:text'; document.body.appendChild(a); a.focus(); a.select(); const ok = document.execCommand('copy'); a.remove(); return ok } catch (e) { return false }
    }
    async function cp(b) { b.textContent = (await copyText(inviteTxt())) ? '已复制 ✓' : '复制失败，请手动复制链接' }
    function closeMask() { $('mask').style.display = 'none'; }
    // 邀请微信好友：
    //  · 微信内置浏览器：网页无法直接拉起分享面板，弹出「右上角 ··· → 发送给朋友」指引（页面地址已带房间号，转发即完整链接）
    //  · 手机浏览器：调起系统分享面板，选微信 → 选好友，发送「邀请文案 + 完整链接」
    //  · 不支持系统分享：复制邀请文案，并尝试拉起微信，粘贴给好友即可
    async function share() {
      if (wx) { $('mask').style.display = 'block'; return }
      const full = inviteTxt(), tip = $('tip');
      if (navigator.share) {
        try { await navigator.share({ title: '老熊格斗', text: full }); if (tip) tip.textContent = '邀请已发出，等待好友加入…'; return }
        catch (e) { if (e && e.name == 'AbortError') return }
      }
      const ok = await copyText(full);
      if (tip) tip.textContent = ok ? (MOBILE ? '邀请已复制，正在打开微信，粘贴发给好友即可' : '邀请已复制，请打开微信粘贴发给好友') : '复制失败，请长按下方链接手动复制';
      if (ok && MOBILE) setTimeout(() => { location.href = 'weixin://' }, 500)
    }
    function joinUI() { mode = 'on'; show(`<h2>输入房间号</h2><input id=rc maxlength=4 autocapitalize=characters placeholder="4位房间号" style="text-align:center;font-size:28px;letter-spacing:6px"><small id=tip>向房主要房间号，或直接点开他发来的链接</small><div class=bt><button onclick=jr()>下一步 · 选择角色</button><button class=s onclick=home()>返回</button></div>`); $('rc').focus() }
    function jr() { const v = $('rc').value.trim().toUpperCase(); if (v.length != 4) return $('tip').textContent = '请输入4位房间号'; R = v; go('on') }
    function onMsg(m) {
      if (m.t == 'hi') { c1 = m.c; send({ t: 'go', h: c0, g: m.c }); start() }
      else if (m.t == 'go') { c0 = m.h; c1 = m.g; start() }
      else if (m.t == 's' && F.length) {
        const r = F[1 - me], dm = r.hp - m.hp; if (dm > 4) hitFx(m.x, m.y + 60, dm, m.z, F[me].st == 'atk' && !!F[me].A && !!F[me].A.fin);   // 对方受击：本端同步播放命中特效（本端正在出终结技则加强）
        Object.assign(r, { x: m.x, y: m.y, f: m.f, st: m.st, t: m.tt, hp: m.hp, en: m.en, n: m.n, a: m.a, A: gA(m.a, r.c, m.cb), vx: m.vx, z: m.z, cb: m.cb, seen: m.sn, cc: m.cc, cd: m.cd, inv: m.iv, gd: m.gd, gb: m.gb })
      }
      else if (m.t == 'p' && F.length) (m.l || []).forEach(addP);
      else if (m.t == 'g' && me == 1) {
        if (m.ph == 'intro' && ph != 'intro') { reset(); ui.style.display = 'none' }
        ph = m.ph; tm = m.tm; wins = m.w; rd = m.rd; msg = m.msg; if (ph == 'over' && ui.style.display == 'none') showOver()
      }
      else if (m.t == 'rm' && me == 0) newMatch()
    }
    function showOver() {
      const w = wins[0] > wins[1] ? 0 : 1;
      show(`<h1>${C[F[w].c].n}<br>获胜！</h1><div class=bt><button onclick=again()>再战一局</button><button class=s onclick=home()>主菜单</button></div>`)
    }
    function again() { if (mode == 'on' && me == 1) { send({ t: 'rm' }); show('<h2>等待房主开局…</h2>') } else newMatch() }

    /* ---------- 输入 ---------- */
    onkeydown = e => { K[e.key.toLowerCase()] = 1; if (e.key.startsWith('Arrow')) e.preventDefault() }; onkeyup = e => { K[e.key.toLowerCase()] = 0 };
    document.querySelectorAll('#pad b').forEach(b => {
      const k = b.dataset.k, s = v => e => { e.preventDefault(); pad[k] = v; b.classList.toggle('on', v) };
      b.addEventListener('pointerdown', s(1));['pointerup', 'pointercancel', 'pointerleave'].forEach(n => b.addEventListener(n, s(0)))
    });
    oncontextmenu = e => e.preventDefault();
    if (R) show(`<h1>老熊格斗</h1><p>好友邀请你来一场熊熊对决！</p><button onclick="go('on')">接受挑战</button>`); else home();
  </script>
